name: PyInstaller Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash
      
      - name: Verify assets directory
        run: |
          if [ -d "assets" ]; then
            echo "Assets directory found"
            ls -la assets/
          else
            echo "Creating assets directory"
            mkdir -p assets
          fi
        shell: bash
      
      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --add-data "assets:assets" \
            --name eco-game \
            --icon assets/icon.png \
            main.py
      
      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --add-data "assets;assets" `
            --name eco-game `
            --icon assets\icon.ico `
            main.py
        shell: pwsh
      
      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --add-data "assets:assets" \
            --name eco-game \
            --icon assets/icon.icns \
            main.py
      
      - name: List build artifacts
        run: |
          echo "=== Distribution contents ==="
          if [ -d "dist" ]; then
            ls -la dist/
            if [ -f "dist/eco-game" ] || [ -f "dist/eco-game.exe" ]; then
              echo "Build successful!"
            fi
          else
            echo "No dist directory found"
          fi
        shell: bash
      
      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v3
        with:
          name: eco-game-linux-py${{ matrix.python-version }}
          path: dist/eco-game
          retention-days: 30
      
      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v3
        with:
          name: eco-game-windows-py${{ matrix.python-version }}
          path: dist/eco-game.exe
          retention-days: 30
      
      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v3
        with:
          name: eco-game-macos-py${{ matrix.python-version }}
          path: dist/eco-game
          retention-days: 30
      
      - name: Create Release Notes
        if: success()
        run: |
          echo "# PyInstaller Build Summary" > build-summary.md
          echo "" >> build-summary.md
          echo "**Build Date:** $(date)" >> build-summary.md
          echo "**OS:** ${{ runner.os }}" >> build-summary.md
          echo "**Python Version:** ${{ matrix.python-version }}" >> build-summary.md
          echo "**Status:** ✅ Success" >> build-summary.md
          echo "" >> build-summary.md
          echo "## Artifacts Generated" >> build-summary.md
          ls -la dist/ >> build-summary.md 2>&1 || echo "No artifacts found" >> build-summary.md
      
      - name: Upload build summary
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: build-summary-${{ runner.os }}-py${{ matrix.python-version }}
          path: build-summary.md
          retention-days: 30

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run pytest
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html 2>&1 || echo "Tests completed with warnings"
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## PyInstaller Build Release
            
            This release includes compiled executables for multiple platforms:
            - Linux executable
            - Windows executable (.exe)
            - macOS executable
            
            Built from commit: ${{ github.sha }}
            Build date: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
